# fly.toml app configuration for GAC-ChatBI backend
# https://fly.io/docs/reference/configuration/

app = 'gac-chatbi'
primary_region = 'sjc'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
