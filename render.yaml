# GAC-ChatBI Render 双服务部署声明（Infrastructure as Code）
# 官方参考：https://docs.render.com/blueprint-spec
# 使用方式：Render 控制台 → New + → Blueprint → 关联此仓库

services:
  # ──────────────────────────────────────────────────────
  # 1. 后端：FastAPI Web Service（Python 原生运行时）
  # 不指定 plan → 使用默认 Free 实例（512MB / 0.1 CPU）
  # ──────────────────────────────────────────────────────
  - type: web
    name: gac-chatbi-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LLM_BASE_URL
        value: "https://api.deepseek.com/v1"
      - key: PYTHONPATH
        value: "/opt/render/project/src/backend"
      # ⚠️ secret 字段，不写入仓库
      - key: LLM_API_KEY
        sync: false

  # ──────────────────────────────────────────────────────
  # 2. 前端：Next.js Static Site
  # Render 官方写法：type=web + runtime=static + staticPublishPath
  # Static Site 本身免费（不消耗 build minute）
  # ──────────────────────────────────────────────────────
  - type: web
    name: gac-chatbi-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
